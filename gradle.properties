# Pengaturan build disesuaikan dengan laptop pengembang:
# Intel Core i5-11300H (4 core / 8 thread), RAM 8 GB (7 GB terbaca), SSD NVMe, Ubuntu 25.04.
# RAM adalah batas utama, karena Android Studio/VS Code, Chrome, dan emulator berbagi 8 GB yang sama.

# Satu JVM Gradle dengan heap 1,5 GB. Kompilator Kotlin dijalankan di dalam JVM ini (in-process),
# bukan sebagai daemon terpisah. Secara bawaan, daemon Kotlin ikut memakai heap sebesar ini,
# jadi tanpa pengaturan ini ada dua JVM yang masing-masing bisa memakan memori besar.
org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=512m -XX:+UseParallelGC -Dfile.encoding=UTF-8
kotlin.compiler.execution.strategy=in-process

# Batasi pekerjaan paralel ke 4 (jumlah core fisik) agar puncak pemakaian RAM tidak terlalu tinggi.
org.gradle.workers.max=4

# Daemon Gradle berhenti sendiri setelah 30 menit tidak dipakai (bawaannya 3 jam),
# supaya RAM kembali untuk aplikasi lain.
org.gradle.daemon.idletimeout=1800000

# Simpan hasil konfigurasi dan keluaran tugas, supaya build berikutnya lebih cepat.
org.gradle.configuration-cache=true
org.gradle.caching=true

android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
